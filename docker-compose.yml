services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: redlake
      POSTGRES_USER: redlake
      POSTGRES_PASSWORD: redlake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redlake -d redlake"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: redlake
      MINIO_ROOT_PASSWORD: redlake-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set redlake http://minio:9000 redlake redlake-secret &&
      mc mb --ignore-existing redlake/redlake-raw"

  api:
    build: .
    environment:
      ENVIRONMENT: development
      APP_VERSION: 0.1.0
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://redlake:redlake@postgres:5432/redlake
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: redlake
      S3_SECRET_KEY: redlake-secret
      S3_BUCKET: redlake-raw
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    ports:
      - "9090:9090"

volumes:
  postgres-data:
  minio-data:
